name: Go

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Set Version and LDFLAGS
        env:
          VERSION_PKG: "github.com/ChrisPortman/nimble_metric_exporter/internal/version"
        run: |
          echo "VERSION=\"$(git describe --tags --abbrev=8 --dirty --always)\"" >> $GITHUB_ENV
          echo "DATE=\"$(date)\"" >> $GITHUB_ENV
          echo "GOVERSION=\"$(go version)\"" >> $GITHUB_ENV
          echo "PREFIX=\"${VERSION_PKG}\"" >> $GITHUB_ENV
          echo "LDFLAGS=\"-s -w\"" >> $GITHUB_ENV
          echo "LDFLAGS=\"$LDFLAGS -X '${PREFIX}.Version=${VERSION}'\"" >> $GITHUB_ENV
          echo "LDFLAGS=\"$LDFLAGS -X '${PREFIX}.BuildDate=${DATE}'\"" >> $GITHUB_ENV
          echo "LDFLAGS=\"$LDFLAGS -X '${PREFIX}.GoVersion=${GOVERSION}'\"" >> $GITHUB_ENV
          cat $GITHUB_ENV

      - name: Build
        run: go build -v -o ./bin/ -trimpath -ldflags "${LDFLAGS}" ./...

      - name: Upload Build Output
        uses: actions/upload-artifact@v4
        with:
          name: nimble_exporter
          path: ./bin/nimble_exporter
