name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'

    - name: Build
      run: go build -v  -o ./bin/ ./...

    - name: Upload Build Output
      uses: actions/upload-artifact@v4
      with:
        name: nimble_exporter
        path: ./bin/nimble_exporter
