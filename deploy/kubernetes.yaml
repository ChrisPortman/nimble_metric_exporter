# An example deployment into kubernetes.

apiVersion: v1
kind: Secret
metadata:
  name: my-nimble-secret
  namespace: prometheus
type: Opaque
stringData:
  username: username
  password: password

---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: metrics
    app.kubernetes.io/instance: nimble-metrics-exporter
    app.kubernetes.io/name: nimble-metrics-exporter
  name: nimble-metrics-exporter
  namespace: prometheus
spec:
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/component: metrics
        app.kubernetes.io/instance: nimble-metrics-exporter
      name: nimble-metrics-exporter
      namespace: prometheus
    spec:
      containers:
        - env:
            - name: NIMBLE_HOST
              value: array.domain
            - name: NIMBLE_USERNAME
              valueFrom:
              secretKeyRef:
                name: my-nimble-secret
                key: username
            - name: NIMBLE_PASSWORD
              valueFrom:
              secretKeyRef:
                name: my-nimble-secret
                key: password
            - name: NIMBLE_SSL_NO_VERIFY
              value: "true"
          image: nimble-metrics-exporter:latest
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: 9490
              scheme: HTTP
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          name: nimble-metrics-exporter
          ports:
            - containerPort: 9490
              name: http
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: 9490
              scheme: HTTP
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      securityContext:
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
